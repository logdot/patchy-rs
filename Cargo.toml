[workspace]
members = ["patchy-ffi"]
resolver = "3"

[package]
name = "patchy-rs"
version = "0.2.0"
edition = "2024"

[lib]
name = "patchy"

[dependencies]
log = "0.4"
mmap-rs = "0.6"
thiserror = "1"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
]
