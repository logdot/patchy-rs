name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check all targets
        run: cargo check --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --workspace --all-targets
      - name: Configure source CMake build
        run: cmake -S . -B build -DPATCHY_BUILD_EXAMPLE=ON
      - name: Build C ABI libraries and dynamic C++ example
        run: cmake --build build --config Release
      - name: Install CMake package
        run: cmake --install build --config Release --prefix "${{ github.workspace }}\stage"
      - name: Configure installed dynamic package example
        run: cmake -S examples/cpp -B consumer-dynamic -DCMAKE_PREFIX_PATH="${{ github.workspace }}\stage"
      - name: Build installed dynamic package example
        run: cmake --build consumer-dynamic --config Release
      - name: Configure installed static package example
        run: cmake -S examples/cpp -B consumer-static -DCMAKE_PREFIX_PATH="${{ github.workspace }}\stage" -DPATCHY_EXAMPLE_LINK_STATIC=ON
      - name: Build installed static package example
        run: cmake --build consumer-static --config Release
